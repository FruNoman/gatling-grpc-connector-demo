# The targets a run can take: -Denv=<block> (local by default). Any value is overridable with -D<env>.<path>=…
# (Typesafe Config), e.g. -Dlocal.grpcbin.deadline-ms=5000. No secrets here — grpcbin needs none.

local {
  grpcbin {
    # docker compose up -d publishes grpcbin's insecure gRPC port on the host
    target = "localhost:9000"
    plaintext = true
    # every call's deadline — a hung call ends as a named KO, not as a user that never finishes
    deadline-ms = 10000
    # the chunked shapes: bytes per message, and how many messages one upload stream sends
    chunk-bytes = 65536
    upload-chunks = 10
  }
}

# grpcb.in is the public instance of the same server (TLS on 9001) — handy to prove the connector against a remote target
public {
  grpcbin {
    target = "grpcb.in:9001"
    plaintext = false
    deadline-ms = 10000
    chunk-bytes = 16384
    upload-chunks = 5
  }
}
